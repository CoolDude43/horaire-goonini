<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horaire Goonini</title>
  <style>
    /* ── Reset de base ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f6fb; color: #222; min-height: 100vh; }

    /* ── En-tête bleu en haut de page ── */
    .header { background: #2F4F8F; color: white; padding: 16px 24px; font-size: 18px; font-weight: bold; }

    /* ── Conteneur centré, max 700px ── */
    .container { max-width: 700px; margin: 24px auto; padding: 0 16px; }

    /* ── Carte blanche avec bordure arrondie ── */
    .card { background: white; border-radius: 12px; border: 1px solid #e0e0e0; padding: 20px; margin-bottom: 16px; }

    /* ── Titre de section en gris majuscule ── */
    .section-title { font-size: 13px; font-weight: 600; color: #888; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── Grille 3 colonnes pour les boutons de noms ── */
    .name-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 4px; }

    /* ── Bouton de sélection de nom ── */
    .name-btn { padding: 10px; border-radius: 8px; border: 1.5px solid #e0e0e0; background: white; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.15s; }
    .name-btn:hover { background: #f4f6fb; }
    .name-btn.active { border-width: 2px; font-weight: bold; }

    /* ── Petit cercle de couleur à côté du nom ── */
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* ── Barre d'onglets (Mon horaire / Vue collective) ── */
    .tab-bar { display: flex; gap: 6px; margin-bottom: 20px; }
    .tab { padding: 8px 20px; border-radius: 8px; border: 1px solid #e0e0e0; background: white; color: #888; font-size: 13px; cursor: pointer; }
    .tab.active { background: #2F4F8F; color: white; border-color: #2F4F8F; font-weight: 600; }

    /* ── Sélecteur de semaine (label + dropdown) ── */
    .week-selector { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .week-selector label { font-size: 13px; color: #888; white-space: nowrap; }
    select { font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid #e0e0e0; background: white; color: #222; }

    /* ── Ligne d'un jour : [label] [début] [fin] [×] ── */
    .day-row { display: grid; grid-template-columns: 90px 1fr 1fr 36px; gap: 8px; align-items: center; margin-bottom: 8px; }
    .day-label { font-size: 13px; color: #555; }
    input[type=time] { font-size: 13px; padding: 6px 8px; border-radius: 8px; border: 1px solid #e0e0e0; width: 100%; }

    /* ── Bouton × pour effacer les heures d'un jour ── */
    .clear-btn { background: none; border: none; cursor: pointer; color: #bbb; font-size: 18px; display: flex; align-items: center; justify-content: center; }
    .clear-btn:hover { color: #555; }

    /* ── Bouton Sauvegarder ── */
    .save-btn { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #2F4F8F; background: #2F4F8F; color: white; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .save-btn:hover { background: #1e3a6e; }



    /* ── Message de confirmation après sauvegarde ── */
    .save-msg { font-size: 12px; color: #58B77A; text-align: center; margin-top: 6px; display: none; }

    /* ── Légende des couleurs dans la vue collective ── */
    .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #555; }

    /* ── Titre d'un jour dans la timeline ── */
    .tl-day-label { font-size: 13px; font-weight: 600; color: #444; margin: 0 0 6px; }

    /* ── Piste grise sur laquelle les barres de quart se superposent ── */
    .tl-track { position: relative; height: 28px; background: #f0f2f7; border-radius: 6px; overflow: hidden; margin-bottom: 3px; }

    /* ── Barre colorée représentant un quart de travail ── */
    .tl-bar { position: absolute; top: 4px; height: 20px; border-radius: 4px; display: flex; align-items: center; padding: 0 6px; font-size: 11px; font-weight: 600; color: white; overflow: hidden; white-space: nowrap; }

    /* ── Étiquettes d'heures sous la timeline (0h, 6h, 12h...) ── */
    .tl-hours { display: flex; justify-content: space-between; margin: 2px 0 6px; }
    .tl-hour-label { font-size: 10px; color: #aaa; }

    /* ── Texte quand aucun quart n'est enregistré pour un jour ── */
    .empty-day { font-size: 12px; color: #bbb; margin-bottom: 12px; }

    /* ── Statut de sync en bas de la vue collective ── */
    .status { font-size: 12px; color: #aaa; text-align: center; padding: 8px; }
  </style>
</head>
<body>

<div class="header">📅 Horaire Goonini</div>

<div class="container">

  <div class="tab-bar">
    <button class="tab active" onclick="showTab('entry')" id="tab-entry">Mon horaire</button>
    <button class="tab" onclick="showTab('view')" id="tab-view">Vue collective</button>
  </div>

  <div id="panel-entry">

    <div class="card">
      <p class="section-title">Qui es-tu ?</p>
      <div class="name-grid" id="name-grid"></div>
    </div>

    <div class="card" id="schedule-card" style="display:none">
      <p class="section-title" id="schedule-title">Mes quarts</p>

      <div class="week-selector">
        <label>Semaine :</label>
        <select id="week-select"></select>
      </div>

      <div id="days-container"></div>

      <button class="save-btn" id="btn-save-shifts">✓ Sauvegarder</button>
      <p class="save-msg" id="save-msg">Sauvegardé !</p>

      <button class="save-btn" id="btn-save-all-weeks" style="background: #4a5568; border-color: #4a5568; margin-top: 8px;">📋 Sauvegarder pour toutes les semaines</button>
    </div>
  </div>



<p class="save-msg" id="save-msg">Sauvegardé !</p>


  <div id="panel-view" style="display:none">
    <div class="card">

      <div class="week-selector">
        <label>Semaine :</label>
        <select id="week-select-view"></select>
      </div>

      <div class="legend" id="legend"></div>

      <div id="collective-view"></div>

      <p class="status" id="sync-status">Chargement...</p>
    </div>
  </div>

</div>


<script type="module">
  // ==========================================
  // 1. CONFIGURATION ET INITIALISATION
  // ==========================================

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // Configuration de ta base de données Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyBmqBVV7NG452qr0UxsDQIv0gBXXqHgDsE",
    authDomain: "horairegoonini.firebaseapp.com",
    projectId: "horairegoonini",
    storageBucket: "horairegoonini.firebasestorage.app",
    messagingSenderId: "279573988471",
    appId: "1:279573988471:web:f927871e776784f8d6f272",
    measurementId: "G-51FTR7YXEE"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Configuration des membres de ton groupe et leurs couleurs respectives
  const MEMBERS = [
    { name: "Alex",   color: "#3F9120" },
    { name: "PO",     color: "#871F16" },
    { name: "Jac",   color: "#231687" },
    { name: "Sam",    color: "#D1462A" },
    { name: "Xav", color: "#2ECAD1" },
    { name: "Fyl",    color: "#564304" },
  ];

  const DAYS = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];

  // Variables de mémoire de l'application (État global)
  let currentUser = null; // Contiendra le nom du membre sélectionné (ex: "Alex")
  let allData = {};       // contiendra TOUT Firestore structuré ainsi : { "Nom": { "IndexSemaine": { "Date": {start, end} } } }


  // ==========================================
  // 2. FONCTIONS DE GÉNÉRATION DES SEMAINES
  // ==========================================

  /**
   * Génère dynamiquement le tableau de toutes les semaines du 17 mai au 7 septembre 2026.
   * Calcule automatiquement la date de début et de fin de chaque bloc de 7 jours.
   */
  function getWeeks() {
    const weeks = [];
    let d = new Date(2026, 4, 17); // Mois commençant à 0 en JS (4 = Mai)
    const end = new Date(2026, 8, 7); // 7 Septembre 2026

    while (d <= end) {
      const fin = new Date(d);
      fin.setDate(fin.getDate() + 6); // Ajoute 6 jours pour fermer la semaine
      
      const fmt = dt => dt.toLocaleDateString('fr-CA', { day: '2-digit', month: 'short' });
      
      weeks.push({
        label: `${fmt(d)} – ${fmt(fin)}`, // Exemple d'affichage : "17 mai – 23 mai"
        start: new Date(d) // Garde l'objet Date brut en mémoire pour les calculs de jours
      });
      d.setDate(d.getDate() + 7); // Passe au dimanche suivant
    }
    return weeks;
  }

  const WEEKS = getWeeks(); // Exécution immédiate pour avoir notre liste de semaines disponible partout


  /**
   * Remplit les deux menus déroulants (<select>) avec les semaines générées par getWeeks().
   * Sélectionne par défaut la semaine correspondant à la date d'aujourd'hui.
   */
  function initWeekSelectors() {
    ['week-select', 'week-select-view'].forEach(id => {
      const sel = document.getElementById(id);
      sel.innerHTML = '';

      WEEKS.forEach((w, i) => {
        const o = document.createElement('option');
        o.value = i; // L'identifiant de la semaine sera sa position (0, 1, 2...)
        o.textContent = w.label;
        sel.appendChild(o);
      });

      // Algorithme de pré-sélection de la semaine actuelle basé sur l'horloge de l'appareil
      const now = new Date();
      const idx = WEEKS.findIndex((w, i) => !WEEKS[i+1] || now < WEEKS[i+1].start);
      sel.value = Math.max(0, idx); // Si on est avant le 17 mai, sélectionne la semaine 0 par défaut
    });
  }


  // ==========================================
  // 3. LOGIQUE DE L'ONGLET "MON HORAIRE"
  // ==========================================

  /**
   * Dessine la grille de boutons pour choisir qui utilise l'application.
   * Ajoute une coche "✓" à côté du nom s'il possède au moins un quart enregistré.
   */
  function initNames() {
    const grid = document.getElementById('name-grid');
    grid.innerHTML = '';

    MEMBERS.forEach(m => {
      // Vérifie si ce membre possède au moins un document avec des données dans allData
      const hasData = allData[m.name] && Object.values(allData[m.name]).some(w => Object.keys(w).length > 0);
      
      const btn = document.createElement('button');
      btn.className = 'name-btn' + (currentUser === m.name ? ' active' : '');

      if (currentUser === m.name) btn.style.borderColor = m.color;
      btn.innerHTML = `<span class="dot" style="background:${m.color}"></span>${m.name}${hasData ? ' ✓' : ''}`;

      // Au clic, on active le membre, on affiche le formulaire d'horaires et on le dessine
      btn.onclick = () => {
        currentUser = m.name;
        initNames(); // Redessine la grille pour appliquer la classe active
        document.getElementById('schedule-card').style.display = ''; // Rend visible la carte de saisie
        document.getElementById('schedule-title').textContent = `Quarts de ${m.name}`;
        renderDays(); // Génère les 7 jours de saisie pour la semaine choisie
      };
      grid.appendChild(btn);
    });
  }


  /**
   * Génère les 7 lignes (du Dimanche au Samedi) pour la saisie des heures.
   * Remplit automatiquement les champs s'il y a déjà des données enregistrées pour cette semaine.
   */
  function renderDays() {
    if (!currentUser) return; // Sécurité : impossible de générer les jours si on ne sait pas c'est qui

    const wIdx = parseInt(document.getElementById('week-select').value);
    const weekStart = WEEKS[wIdx].start;

    const container = document.getElementById('days-container');
    container.innerHTML = '';

    // Va chercher les données en mémoire spécifiques à [Utilisateur][Semaine] ou prend un objet vide
    const weekData = allData[currentUser]?.[wIdx] || {};

    DAYS.forEach((day, di) => {
      // Calcule la date exacte de chaque jour de la semaine (Début de semaine + index du jour)
      const dateKey = new Date(weekStart);
      dateKey.setDate(dateKey.getDate() + di);
      const key = dateKey.toISOString().slice(0, 10); // Format strict "AAAA-MM-JJ" pour s'aligner avec Firestore

      const shift = weekData[key] || { start: '', end: '' };

      const row = document.createElement('div');
      row.className = 'day-row';
      row.innerHTML = `
        <span class="day-label">${day.slice(0,3)} ${dateKey.getDate()}</span>
        <input type="time" id="s_${key}" value="${shift.start}">
        <input type="time" id="e_${key}" value="${shift.end}">
        <button class="clear-btn" data-key="${key}" title="Effacer">×</button>`;

      container.appendChild(row);
    });

    // Écouteur d'événement sur les boutons "X" pour vider instantanément les inputs de temps d'une ligne
    container.querySelectorAll('.clear-btn').forEach(btn => {
      btn.onclick = (e) => {
        const k = e.currentTarget.getAttribute('data-key');
        document.getElementById('s_' + k).value = '';
        document.getElementById('e_' + k).value = '';
      };
    });
  }


  /**
   * Parcourt les inputs de l'interface pour rassembler les heures saisies,
   * puis les téléverse dans Firestore sous un document unique nommé : Nom_semaine_Index.
   */
  async function saveShifts() {
    if (!currentUser) return;

    const wIdx = parseInt(document.getElementById('week-select').value);
    const weekStart = WEEKS[wIdx].start;
    const weekData = {};

    // Collecte les données de chaque input de la page
    DAYS.forEach((_, di) => {
      const dateKey = new Date(weekStart);
      dateKey.setDate(dateKey.getDate() + di);
      const key = dateKey.toISOString().slice(0, 10);

      const s = document.getElementById('s_' + key)?.value;
      const e = document.getElementById('e_' + key)?.value;

      // N'enregistre que les jours complets (Heure de début ET de fin saisie)
      if (s && e) {
        weekData[key] = { start: s, end: e };
      }
    });

    // Envoi à Firestore (écrase le document s'il existait déjà pour rafraîchir)
    await setDoc(doc(db, 'horaires', `${currentUser}_semaine_${wIdx}`), weekData);

    // Petit effet visuel "Sauvegardé !" pendant 2 secondes
    const msg = document.getElementById('save-msg');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 2000);
    initNames();
  }


  // Sauvegarde les quarts pour toutes les semaines disponibles :
  async function saveShiftsToAllWeeks() {
    if (!currentUser) return;
    if (!confirm(`Voulez-vous copier cet horaire dans TOUTES les semaines de l'été pour ${currentUser} ? Cela écrasera vos données existantes.`)) return;

    const wIdxActuel = parseInt(document.getElementById('week-select').value);
    const weekStartActuel = WEEKS[wIdxActuel].start;
    const templateData = {};

    DAYS.forEach((_, di) => {
      const dateKey = new Date(weekStartActuel);
      dateKey.setDate(dateKey.getDate() + di);
      const key = dateKey.toISOString().slice(0, 10);
      const s = document.getElementById('s_' + key)?.value;
      const e = document.getElementById('e_' + key)?.value;
      if (s && e) templateData[di] = { start: s, end: e };
    });

    const promises = WEEKS.map(async (semaine, indexSemaine) => {
      const weekData = {};
      const weekStart = semaine.start;
      DAYS.forEach((_, di) => {
        const dateKey = new Date(weekStart);
        dateKey.setDate(dateKey.getDate() + di);
        const key = dateKey.toISOString().slice(0, 10);
        if (templateData[di]) weekData[key] = { start: templateData[di].start, end: templateData[di].end };
      });
      return setDoc(doc(db, 'horaires', `${currentUser}_semaine_${indexSemaine}`), weekData);
    });

    await Promise.all(promises);
    const msg = document.getElementById('save-msg');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 2000);
    initNames();
  }


  // ==========================================
  // 4. LOGIQUE DE L'ONGLET "VUE COLLECTIVE" (TIMELINE)
  // ==========================================

  /**
   * Transforme une chaîne "HH:MM" en pourcentage de journée (valeur entre 0.0 et 1.0).
   * Utile pour positionner les barres horizontales sur l'écran (ex: 12:00 -> 0.5 -> 50% de large).
   */
  function timeToFrac(t) {
    if (!t) return null;
    const [h, m] = t.split(':').map(Number);
    return (h * 60 + m) / 1440; // 1440 est le nombre de minutes dans 24 heures
  }


  /**
   * Génère la vue d'ensemble du groupe. Lit la mémoire globale pour créer des barres de couleur
   * proportionnelles aux quarts de travail et calcule mathématiquement les heures de présence communes.
   */
  function renderView() {
    const wIdx = parseInt(document.getElementById('week-select-view').value);
    const weekStart = WEEKS[wIdx].start;

    // ── MIE EN PLACE DE LA LÉGENDE DES COULEURS ──
    const legend = document.getElementById('legend');
    legend.innerHTML = MEMBERS.map(m => {
      const hasAny = allData[m.name]?.[wIdx] && Object.keys(allData[m.name][wIdx]).length > 0;
      return `<div class="legend-item">
        <span class="dot" style="background:${m.color};opacity:${hasAny?1:0.3}"></span>
        <span style="opacity:${hasAny?1:0.4}">${m.name}</span>
      </div>`;
    }).join('');

    const cv = document.getElementById('collective-view');
    cv.innerHTML = '';

    // ── CONSTRUCTION DE LA TIMELINE JOUR PAR JOUR ──
    DAYS.forEach((day, di) => {
      const dateKey = new Date(weekStart);
      dateKey.setDate(dateKey.getDate() + di);
      const key = dateKey.toISOString().slice(0, 10);

      // Récupère la liste de tous les membres qui travaillent ce jour précis
      const shifts = MEMBERS
        .map(m => ({ member: m, shift: allData[m.name]?.[wIdx]?.[key] || null }))
        .filter(x => x.shift);

      const block = document.createElement('div');

      const label = document.createElement('p');
      label.className = 'tl-day-label';
      label.textContent = `${day} ${dateKey.getDate()}`;
      block.appendChild(label);

      if (shifts.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-day';
        empty.textContent = 'Aucun quart enregistré';
        block.appendChild(empty);
      } else {
        // Dessine une barre horizontale pour chaque travailleur du jour
        shifts.forEach(({ member, shift }) => {
          const track = document.createElement('div');
          track.className = 'tl-track';

          const sf = timeToFrac(shift.start);
          const ef = timeToFrac(shift.end);

          if (sf !== null && ef !== null && ef > sf) {
            const bar = document.createElement('div');
            bar.className = 'tl-bar';
            bar.style.left = (sf * 100) + '%'; // Position de départ en %
            bar.style.width = ((ef - sf) * 100) + '%'; // Longueur de la barre en %
            bar.style.background = member.color;

            const startHour = shift.start.split(':')[0] + 'h'; // Transforme "08:00" en "08h"
            const endHour = shift.end.split(':')[0] + 'h';     // Transforme "16:00" en "16h"
            bar.textContent = `${member.name} ${startHour}–${endHour}`;

            track.appendChild(bar);
          }
          block.appendChild(track);
        });

        // Ajoute la petite ligne de repère des heures (0h, 6h, 12h...) sous les barres
        const hoursDiv = document.createElement('div');
        hoursDiv.className = 'tl-hours';
        ['0h','6h','12h','18h','24h'].forEach(h => {
          const s = document.createElement('span');
          s.className = 'tl-hour-label';
          s.textContent = h;
          hoursDiv.appendChild(s);
        });
        block.appendChild(hoursDiv);

      }
      cv.appendChild(block);
    });

    // Met à jour la note de synchronisation en bas de l'écran
    document.getElementById('sync-status').textContent = `Dernière mise à jour : ${new Date().toLocaleTimeString('fr-CA')}`;
  }


  // ==========================================
  // 5. COMMUTATION D'ONGLETS ET ÉVÉNEMENTS UI
  // ==========================================

  /**
   * Gère le basculement d'affichage entre l'onglet Saisie ("Mon horaire") et Visionneuse ("Vue collective").
   */
  window.showTab = (t) => {
    document.getElementById('panel-entry').style.display = t === 'entry' ? '' : 'none';
    document.getElementById('panel-view').style.display  = t === 'view'  ? '' : 'none';
    
    // Alterne les classes CSS actives sur les boutons du menu d'onglets
    document.getElementById('tab-entry').className = 'tab' + (t === 'entry' ? ' active' : '');
    document.getElementById('tab-view').className  = 'tab' + (t === 'view'  ? ' active' : '');
    
    // Si l'utilisateur clique sur la vue collective, on la recalcule immédiatement
    if (t === 'view') renderView();
  };

  // Attachement des fonctions de rafraîchissement lors des interactions utilisateur avec les menus déroulants
  document.getElementById('week-select').onchange = () => renderDays();
  document.getElementById('week-select-view').onchange = () => renderView();
  document.getElementById('btn-save-shifts').onclick = () => saveShifts();

  document.getElementById('btn-save-all-weeks').onclick = () => saveShiftsToAllWeeks();

  // ==========================================
  // 6. SYNCHRONISATION EN TEMPS RÉEL (FIREBASE)
  // ==========================================

  /**
   * Écouteur Firebase en temps réel (`onSnapshot`). 
   * S'active automatiquement dès que l'application s'ouvre OU dès que quelqu'un modifie Firestore.
   * Il reconstruit la variable `allData` et force l'écran à se mettre à jour sans recharger la page.
   */
  onSnapshot(collection(db, 'horaires'), (snapshot) => {
    allData = {}; // On vide l'ancienne mémoire locale pour reconstruire proprement avec les nouvelles réalités de Firestore

    snapshot.forEach(docSnap => {
      // Découpe l'ID du document (ex: "Alex_semaine_2" devient ["Alex", "2"])
      const parts = docSnap.id.split('_semaine_');
      if (parts.length === 2) {
        const uName = parts[0];
        const wIndex = parseInt(parts[1]);
        
        // Crée la structure imbriquée en mémoire si elle n'existait pas encore pour ce membre
        if (!allData[uName]) allData[uName] = {};
        allData[uName][wIndex] = docSnap.data(); // Injection du JSON des jours de travail
      }
    });
    
    // Actualisation des interfaces graphiques suite à la réception des données de la base
    initNames();
    
    // Sécurité : Ne rafraîchit l'interface de saisie que si l'utilisateur a sélectionné son identité
    if (currentUser) {
      renderDays();
    }

    // Si l'utilisateur est actuellement en train de regarder l'onglet de la vue collective, on la redessine en direct
    const viewPanel = document.getElementById('panel-view');
    if (viewPanel && viewPanel.style.display !== 'none') {
      renderView();
    }
  });


  // ==========================================
  // 7. DÉMARRAGE INITIAL DE L'APP
  // ==========================================
