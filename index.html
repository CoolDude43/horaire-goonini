<script type="module">
  // ── Imports Firebase (chargés depuis le CDN Google) ──
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ── Configuration Firebase ──
  const firebaseConfig = {
    apiKey: "AIzaSyBmqBVV7NG452qr0UxsDQIv0gBXXqHgDsE",
    authDomain: "horairegoonini.firebaseapp.com",
    projectId: "horairegoonini",
    storageBucket: "horairegoonini.firebasestorage.app",
    messagingSenderId: "279573988471",
    appId: "1:279573988471:web:f927871e776784f8d6f272",
    measurementId: "G-51FTR7YXEE"
  };

  // ── Initialisation de Firebase et Firestore ──
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ── Liste des membres du groupe ──
  const MEMBERS = [
    { name: "Alex",   color: "#3F9120" },
    { name: "PO",     color: "#871F16" },
    { name: "Jaco",   color: "#231687" },
    { name: "Sam",    color: "#D1462A" },
    { name: "Xavier", color: "#2ECAD1" },
    { name: "Fyl",    color: "#564304" },
  ];

  // ── Noms des jours de la semaine ──
  const DAYS = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];

  // ── Génération de toutes les semaines entre le 17 mai et le 7 sept 2026 ──
  function getWeeks() {
    const weeks = [];
    let d = new Date(2026, 4, 17);
    const end = new Date(2026, 8, 7);

    while (d <= end) {
      const fin = new Date(d);
      fin.setDate(fin.getDate() + 6);

      const fmt = dt => dt.toLocaleDateString('fr-CA', { day: '2-digit', month: 'short' });

      weeks.push({
        label: `${fmt(d)} – ${fmt(fin)}`,
        start: new Date(d)
      });

      d.setDate(d.getDate() + 7);
    }
    return weeks;
  }

  const WEEKS = getWeeks();

  // ── Variables d'état globales ──
  let currentUser = null; 
  let allData = {}; // Structure : { "Alex": { "0": { "2026-05-17": {...} }, "1": {...} } }

  // ── Initialise les deux dropdowns de semaine ──
  function initWeekSelectors() {
    ['week-select', 'week-select-view'].forEach(id => {
      const sel = document.getElementById(id);
      sel.innerHTML = '';

      WEEKS.forEach((w, i) => {
        const o = document.createElement('option');
        o.value = i;
        o.textContent = w.label;
        sel.appendChild(o);
      });

      const now = new Date();
      const idx = WEEKS.findIndex((w, i) => !WEEKS[i+1] || now < WEEKS[i+1].start);
      sel.value = Math.max(0, idx);
    });
  }

  // ── Génère les boutons de noms dans la grille ──
  function initNames() {
    const grid = document.getElementById('name-grid');
    grid.innerHTML = '';

    MEMBERS.forEach(m => {
      // Vérifie si ce membre a des données dans au moins une semaine
      const hasData = allData[m.name] && Object.values(allData[m.name]).some(w => Object.keys(w).length > 0);

      const btn = document.createElement('button');
      btn.className = 'name-btn' + (currentUser === m.name ? ' active' : '');

      if (currentUser === m.name) btn.style.borderColor = m.color;

      btn.innerHTML = `<span class="dot" style="background:${m.color}"></span>${m.name}${hasData ? ' ✓' : ''}`;

      btn.onclick = () => {
        currentUser = m.name;
        initNames();
        document.getElementById('schedule-card').style.display = '';
        document.getElementById('schedule-title').textContent = `Quarts de ${m.name}`;
        renderDays();
      };

      grid.appendChild(btn);
    });
  }

  // ── Génère les lignes de jours pour la semaine sélectionnée ──
  function renderDays() {
    if (!currentUser) return;

    const wIdx = parseInt(document.getElementById('week-select').value);
    const weekStart = WEEKS[wIdx].start;

    const container = document.getElementById('days-container');
    container.innerHTML = '';

    // Récupère les données spécifiquement pour la semaine sélectionnée
    const weekData = allData[currentUser]?.[wIdx] || {};

    DAYS.forEach((day, di) => {
      const dateKey = new Date(weekStart);
      dateKey.setDate(dateKey.getDate() + di);
      const key = dateKey.toISOString().slice(0, 10);

      const shift = weekData[key] || { start: '', end: '' };

      const row = document.createElement('div');
      row.className = 'day-row';
      row.innerHTML = `
        <span class="day-label">${day.slice(0,3)} ${dateKey.getDate()}</span>
        <input type="time" id="s_${key}" value="${shift.start}" placeholder="Début">
        <input type="time" id="e_${key}" value="${shift.end}" placeholder="Fin">
        <button class="clear-btn" onclick="clearDay('${key}')" title="Effacer">×</button>`;

      container.appendChild(row);
    });
  }

  // ── Efface les heures d'un jour spécifique dans l'interface ──
  window.clearDay = (key) => {
    document.getElementById('s_' + key).value = '';
    document.getElementById('e_' + key).value = '';
  };

  // ── Sauvegarde les quarts de la semaine courante uniquement ──
  window.saveShifts = async () => {
    if (!currentUser) return;

    const wIdx = parseInt(document.getElementById('week-select').value);
    const weekStart = WEEKS[wIdx].start;

    const weekData = {};

    DAYS.forEach((_, di) => {
      const dateKey = new Date(weekStart);
      dateKey.setDate(dateKey.getDate() + di);
      const key = dateKey.toISOString().slice(0, 10);

      const s = document.getElementById('s_' + key)?.value;
      const e = document.getElementById('e_' + key)?.value;

      if (s && e) {
        weekData[key] = { start: s, end: e };
      }
    });

    // Sauvegarde dans un document dédié à cette semaine précise pour cet utilisateur
    await setDoc(doc(db, 'horaires', `${currentUser}_semaine_${wIdx}`), weekData);

    const msg = document.getElementById('save-msg');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 2000);

    initNames();
  };

  // ── Convertit une heure "HH:MM" en fraction de journée ──
  function timeToFrac(t) {
    if (!t) return null;
    const [h, m] = t.split(':').map(Number);
    return (h * 60 + m) / 1440;
  }

  // ── Génère la vue collective pour la semaine sélectionnée ──
  function renderView() {
    const wIdx = parseInt(document.getElementById('week-select-view').value);
    const weekStart = WEEKS[wIdx].start;

    // ── Légende des membres ──
    const legend = document.getElementById('legend');
    legend.innerHTML = MEMBERS.map(m => {
      const hasAny = allData[m.name]?.[wIdx] && Object.keys(allData[m.name][wIdx]).length > 0;

      return `<div class="legend-item">
        <span class="dot" style="background:${m.color};opacity:${hasAny?1:0.3}"></span>
        <span style="opacity:${hasAny?1:0.4}">${m.name}</span>
      </div>`;
    }).join('');

    // ── Timeline jour par jour ──
    const cv = document.getElementById('collective-view');
    cv.innerHTML = '';

    DAYS.forEach((day, di) => {
      const dateKey = new Date(weekStart);
      dateKey.setDate(dateKey.getDate() + di);
      const key = dateKey.toISOString().slice(0, 10);

      // Récupère les quarts de la semaine sélectionnée pour chaque membre
      const shifts = MEMBERS
        .map(m => ({ member: m, shift: allData[m.name]?.[wIdx]?.[key] || null }))
        .filter(x => x.shift);

      const block = document.createElement('div');

      const label = document.createElement('p');
      label.className = 'tl-day-label';
      label.textContent = `${day} ${dateKey.getDate()}`;
      block.appendChild(label);

      if (shifts.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-day';
        empty.textContent = 'Aucun quart enregistré';
        block.appendChild(empty);
      } else {

        shifts.forEach(({ member, shift }) => {
          const track = document.createElement('div');
          track.className = 'tl-track';

          const sf = timeToFrac(shift.start);
          const ef = timeToFrac(shift.end);

          if (sf !== null && ef !== null && ef > sf) {
            const bar = document.createElement('div');
            bar.className = 'tl-bar';
            bar.style.left = (sf * 100) + '%';
            bar.style.width = ((ef - sf) * 100) + '%';
            bar.style.background = member.color;
            bar.textContent = `${member.name} ${shift.start}–${shift.end}`;
            track.appendChild(bar);
          }
          block.appendChild(track);
        });

        const hoursDiv = document.createElement('div');
        hoursDiv.className = 'tl-hours';
        ['0h','6h','12h','18h','24h'].forEach(h => {
          const s = document.createElement('span');
          s.className = 'tl-hour-label';
          s.textContent = h;
          hoursDiv.appendChild(s);
        });
        block.appendChild(hoursDiv);

        const availLabel = document.createElement('p');
        availLabel.className = 'avail-label';
        availLabel.textContent = 'Disponibles ensemble :';
        block.appendChild(availLabel);

        const availTrack = document.createElement('div');
        availTrack.className = 'avail-track';

        const SLOTS = 48;
        const counts = new Array(SLOTS).fill(0);

        shifts.forEach(({ shift }) => {
          const sf = timeToFrac(shift.start);
          const ef = timeToFrac(shift.end);
          if (sf !== null && ef !== null) {
            for (let i = Math.round(sf * SLOTS); i < Math.round(ef * SLOTS); i++) {
              counts[i]++;
            }
          }
        });

        const maxCount = Math.max(...counts);

        for (let i = 0; i < SLOTS; i++) {
          if (!counts[i]) continue;

          let j = i;
          while (j < SLOTS && counts[j] === counts[i]) j++;

          const bar = document.createElement('div');
          bar.style.cssText = `position:absolute;top:0;height:100%;left:${i/SLOTS*100}%;width:${(j-i)/SLOTS*100}%;background:rgba(47,79,143,${0.2+counts[i]/Math.max(maxCount,1)*0.7})`;
          bar.title = `${counts[i]} personne(s)`;
          availTrack.appendChild(bar);
          i = j - 1;
        }

        block.appendChild(availTrack);
      }

      cv.appendChild(block);
    });

    document.getElementById('sync-status').textContent =
      `Dernière mise à jour : ${new Date().toLocaleTimeString('fr-CA')}`;
  }

  // ── Gestion des onglets ──
  window.showTab = (t) => {
    document.getElementById('panel-entry').style.display = t === 'entry' ? '' : 'none';
    document.getElementById('panel-view').style.display  = t === 'view'  ? '' : 'none';
    document.getElementById('tab-entry').className = 'tab' + (t === 'entry' ? ' active' : '');
    document.getElementById('tab-view').className  = 'tab' + (t === 'view'  ? ' active' : '');
    if (t === 'view') renderView();
  };

  // ── Listener temps réel global ──
  // Écoute tous les documents de la collection et organise la mémoire par [membre][semaine]
  onSnapshot(collection(db, 'horaires'), (snapshot) => {
    snapshot.forEach(docSnap => {
      const parts = docSnap.id.split('_semaine_');
      if (parts.length === 2) {
        const uName = parts[0];
        const wIndex = parseInt(parts[1]);
        
        if (!allData[uName]) allData[uName] = {};
        allData[uName][wIndex] = docSnap.data();
      }
    });
    
    initNames();
    renderDays();

    const viewPanel = document.getElementById('panel-view');
    if (viewPanel.style.display !== 'none') renderView();
  });

  // ── Point d'entrée ──
  initWeekSelectors();
</script>
